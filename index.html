<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Batumi Buses — Карты и Маршруты</title>
  <meta name="theme-color" content="#11a37a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="assets/styles/base.css">
  <link rel="stylesheet" href="assets/styles/legacy.css">
  <link rel="stylesheet" href="assets/styles/components.css">
</head>
<body>
<div class="app">
  <div id="map"></div>
  <button class="sidebar-toggle" id="sidebarToggle" title="Меню"><img src="assets/icons/menu.png" alt="Меню"></button>

  <div class="sidebar" id="appSidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Batumi Maps</h2>
      <button class="sidebar-close" id="sidebarClose"><img src="assets/icons/close.png" alt="Закрыть"></button>
    </div>
    <div class="sidebar-content" style="position:relative">
      <div class="route-builder-box">
        <div class="section-title">Построить маршрут</div>
        <div class="route-input-group">
          <span class="route-input-icon"><img src="assets/icons/from-pin.png" alt="Откуда"></span>
          <input type="text" id="fromInput" placeholder="Откуда (GPS или точка)" readonly style="cursor:pointer">
        </div>
        <div class="route-input-group" style="position:relative">
          <span class="route-input-icon"><img src="assets/icons/destination-flag.png" alt="Куда"></span>
          <input type="text" id="toInput" placeholder="Куда едем?">
          <button type="button" id="pickToBtn" class="field-icon-btn" title="Указать точку на карте"><img src="assets/icons/map-pick.png" alt="Указать точку на карте"></button>
          <div class="places-results" id="placesResultsContainer"><div id="placesResultsList"></div></div>
        </div>
        <div class="route-actions">
          <button class="route-action-btn" id="myGpsBtn">Мое GPS</button>
          <button class="route-action-btn primary" id="findTransitBtn">Найти проезд</button>
          <button class="route-action-btn" id="clearPointsBtn">Сброс</button>
        </div>
      </div>

      <div id="transitResultsContainer" class="transit-results-section" style="display:none">
        <div class="section-title">Варианты проезда</div>
        <div id="transitResultsList"></div>
      </div>

      <div id="activeRouteStatusContainer" style="display:none">
        <div class="active-route-panel">
          <div class="active-route-info"><img class="inline-icon" src="assets/icons/bus.png" alt="Автобус"><span id="activeRouteNameDisplay">Маршрут</span><span id="sidebarBusCount" style="background:#11a37a;color:white;padding:1px 6px;border-radius:8px;font-size:11px">0</span></div><button class="live-route-reset-btn" id="liveRouteResetBtn" type="button" title="Сбросить live-маршрут"><img src="assets/icons/close.png" alt="Сбросить"></button>
        </div>
      </div>

      <div class="routes-section">
        <div class="section-title"><span>Живые маршруты автобусов</span></div>
        <div class="dropdown-search"><span class="search-icon"><img src="assets/icons/search.png" alt="Поиск"></span><input type="text" id="searchInput" placeholder="Поиск маршрута..."><button class="clear-btn" id="clearSearchBtn"><img src="assets/icons/close.png" alt="Очистить"></button></div>
        <div id="dropdownBody" class="route-list"><div class="dd-msg">Загрузка маршрутов...</div></div>
      </div>
    </div>
  </div>

  <button class="mobile-search-btn" id="mobileSearchBtn"><span class="mobile-search-btn-icon"><img src="assets/icons/search.png" alt="Поиск"></span><span id="mobileSearchBtnText">Куда едем?</span></button>

  <div class="geo-dropdown-container">
    <button class="geo-btn" id="geoBtn" title="Местоположение"><img src="assets/icons/geolocation.png" alt="Местоположение"></button>
    <div class="geo-dropdown" id="geoDropdownMenu" style="display:none">
      <button class="geo-dropdown-item" id="gpsOptionBtn"><img src="assets/icons/geolocation.png" alt="GPS">По GPS</button>
      <button class="geo-dropdown-item" id="manualOptionBtn"><img src="assets/icons/manual-pick.png" alt="Выбрать на карте">Указать на карте</button>
    </div>
  </div>

  <div class="live-badge" id="liveBadge" style="display:none"><span class="live-dot"></span>Live</div>
  <div class="legend" id="legendBox" style="display:none"><div class="leg-row"><span class="leg-dot fwd"></span>Туда</div><div class="leg-row"><span class="leg-dot bwd"></span>Обратно</div></div>

  <div class="journey-bar" id="journeyBar" hidden>
    <button class="journey-route" id="journeyRouteLabel" type="button" title="Открыть панель маршрута"><img src="assets/icons/bus.png" alt="Автобус"><span>Маршрут</span></button>
    <button class="finish-route-btn" id="finishRouteBtn">Завершить маршрут</button>
  </div>
  <button class="return-follow-btn" id="returnFollowBtn" hidden><img src="assets/icons/return-follow.png" alt="Найти меня">Найти меня</button>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/state.js"></script>
<script src="assets/js/core/map.js"></script>
<script src="assets/js/services/gps.js"></script>
<script src="assets/js/services/places.js"></script>
<script src="assets/js/features/buses.js"></script>
<script src="assets/js/features/stop-board.js"></script>
<script src="assets/js/features/routes.js"></script>
<script src="assets/js/features/navigation.js"></script>
<script src="assets/js/ui/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
