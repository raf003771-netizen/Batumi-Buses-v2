<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Batumi Buses — Карты и Маршруты</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#11a37a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/styles/base.css">
  <link rel="stylesheet" href="assets/styles/components.css">
  <link rel="stylesheet" href="assets/styles/responsive.css">
</head>
<body>
<div class="app">
        <div id="map"></div>

        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Меню">☰</button>

        <div class="sidebar" id="appSidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Batumi Maps</h2>
                <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
            </div>
            
            <div class="sidebar-content" style="position: relative;">
                <div class="route-builder-box">
                    <div class="section-title">Построить маршрут</div>
                    
                    <div class="route-input-group">
                        <span class="route-input-icon">📍</span>
                        <input type="text" id="fromInput" placeholder="Откуда (GPS или точка)" readonly style="cursor: pointer;" onclick="selectRoutePoint('from')">
                    </div>

                    <div class="route-input-group" style="position: relative;">
                        <span class="route-input-icon">🏁</span>
                        <input type="text" id="toInput" placeholder="Куда едем?" oninput="searchPlaces(this.value)">
                        <button type="button" onclick="selectRoutePoint('to')" style="background: none; border: none; cursor: pointer; font-size: 14px; padding: 0;" title="Указать точку на карте">🗺️</button>
                        <div class="places-results" id="placesResultsContainer">
                            <div id="placesResultsList"></div>
                        </div>
                    </div>

                    <div class="route-actions">
                        <button class="route-action-btn" onclick="locateUserForRoute()">Мое GPS</button>
                        <button class="route-action-btn primary" onclick="findTransitRoutes()">Найти проезд</button>
                        <button class="route-action-btn" onclick="clearRoutePoints()">Сброс</button>
                    </div>
                </div>

                <div id="transitResultsContainer" class="transit-results-section" style="display: none;">
                    <div class="section-title">Варианты проезда</div>
                    <div id="transitResultsList"></div>
                </div>

                <div id="activeRouteStatusContainer" style="display: none;">
                    <div class="active-route-panel">
                        <div class="active-route-info">
                            <span>🚌</span> <span id="activeRouteNameDisplay">Маршрут</span>
                            <span id="sidebarBusCount" style="background:#11a37a; color:white; padding:1px 6px; border-radius:8px; font-size:11px;">0</span>
                        </div>
                        <button class="cancel-route-btn" onclick="cancelLiveRoute()">Закрыть</button>
                    </div>
                    <button id="startNavigationBtn" class="start-navigation-btn" onclick="startNavigation()">В путь</button>
                </div>

                <div class="routes-section">
                    <div class="section-title">
                        <span>Живые маршруты автобусов</span>
                    </div>
                    <div class="dropdown-search">
                        <span class="search-icon">⌕</span>
                        <input type="text" id="searchInput" placeholder="Поиск маршрута..." oninput="filterRoutes(this.value)">
                        <button class="clear-btn" onclick="clearSearch()">✕</button>
                    </div>
                    <div id="dropdownBody" class="route-list">
                        <div class="dd-msg">Загрузка маршрутов...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="geo-dropdown-container">
            <button class="geo-btn" id="geoBtn" onclick="toggleGeoDropdown()" title="Местоположение">🎯</button>
            <div class="geo-dropdown" id="geoDropdownMenu" style="display: none;">
                <button class="geo-dropdown-item" onclick="selectGeoOption('gps')">📍 По GPS</button>
                <button class="geo-dropdown-item" onclick="selectGeoOption('manual')">👆 Указать на карте</button>
            </div>
        </div>

        <div class="live-badge" id="liveBadge" style="display:none;">
            <span class="live-dot"></span> Live
        </div>

        <div class="legend" id="legendBox" style="display:none;">
            <div class="leg-row"><span class="leg-dot fwd"></span> Туда</div>
            <div class="leg-row"><span class="leg-dot bwd"></span> Обратно</div>
        </div>

        <button id="returnFollowBtn" class="return-follow-btn" onclick="resumeAutoFollow()">🎯 Вернуться</button>
        <div id="navigationPanel" class="navigation-panel">
            <div id="navigationRouteName" class="navigation-route">Маршрут</div>
            <button class="navigation-close" onclick="resetApplication()" aria-label="Завершить маршрут">✕</button>
        </div>
    </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/state.js"></script>
  <script src="assets/js/core/map.js"></script>
  <script src="assets/js/ui/ui.js"></script>
  <script src="assets/js/services/places.js"></script>
  <script src="assets/js/features/routes.js"></script>
  <script src="assets/js/services/gps.js"></script>
  <script src="assets/js/features/buses.js"></script>
  <script src="assets/js/features/navigation.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
